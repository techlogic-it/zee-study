{% extends "base.html" %}
{% block title %}Account Settings – ZEE STUDY{% endblock %}

{% block content %}
<div class="container" style="max-width:640px">
  <h1 class="page-heading">⚙️ Account Settings</h1>
  <p class="page-sub">Update your personal details and password.</p>

  <!-- Personal details -->
  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-title" style="margin-bottom:1.2rem">Personal Details</div>
    <form method="POST" action="{{ url_for('account') }}">
      <input type="hidden" name="form" value="details">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group" style="margin-bottom:0">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name"
                 value="{{ user.first_name or '' }}" required
                 style="display:block;width:100%;box-sizing:border-box;">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name"
                 value="{{ user.last_name or '' }}" required
                 style="display:block;width:100%;box-sizing:border-box;">
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               value="{{ user.email or '' }}" required
               style="display:block;width:100%;box-sizing:border-box;">
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               value="{{ user.username }}" required
               style="display:block;width:100%;box-sizing:border-box;">
      </div>
      <button type="submit" class="btn btn-green">Save Changes</button>
    </form>
  </div>

  <!-- Change password -->
  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-title" style="margin-bottom:1.2rem">Change Password</div>
    <form method="POST" action="{{ url_for('account') }}">
      <input type="hidden" name="form" value="password">
      <div class="form-group">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" required
               style="display:block;width:100%;box-sizing:border-box;">
      </div>
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password"
               placeholder="At least 6 characters" required
               style="display:block;width:100%;box-sizing:border-box;">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               style="display:block;width:100%;box-sizing:border-box;">
      </div>
      <button type="submit" class="btn btn-green">Update Password</button>
    </form>
  </div>

  <a href="{{ url_for('dashboard') }}" class="btn btn-outline">← Back to Dashboard</a>
</div>
{% endblock %}
