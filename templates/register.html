{% extends "base.html" %}
{% block title %}Register – ZEE STUDY{% endblock %}

{% block content %}
<div class="container-sm">
  <div class="card" style="margin-top:2rem">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="ZEE STUDY" style="width:180px;height:auto;margin-bottom:.5rem;">
      <p>Start your GCSE Science revision journey</p>
    </div>

    <form method="POST">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group" style="margin-bottom:0">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" placeholder="e.g. Zeeshan" required autofocus style="display:block;width:100%;box-sizing:border-box;">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" placeholder="e.g. Ahmed" required style="display:block;width:100%;box-sizing:border-box;">
        </div>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required style="display:block;width:100%;box-sizing:border-box;">
        <small style="display:block;margin-top:.3rem;color:#546e7a;font-size:.8rem">We'll send your quiz reports and revision reminders here.</small>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
      </div>
      <button type="submit" class="btn btn-green btn-block btn-lg">Create Account</button>
    </form>

    <div class="divider"></div>
    <p style="text-align:center;font-size:.9rem;color:#546e7a">
      Already have an account? <a href="{{ url_for('login') }}" style="color:#2e7d32;font-weight:600">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
