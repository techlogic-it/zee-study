{% extends "base.html" %}
{% block title %}Register – ZEE STUDY{% endblock %}

{% block content %}
<div class="container-sm">
  <div class="card" style="margin-top:2rem">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="ZEE STUDY" style="width:180px;height:auto;margin-bottom:.5rem;">
      <p>Start your GCSE Science revision journey</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
        <small style="color:#546e7a;font-size:.8rem">We'll send your quiz reports and revision reminders here.</small>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
      </div>
      <button type="submit" class="btn btn-green btn-block btn-lg">Create Account</button>
    </form>

    <div class="divider"></div>
    <p style="text-align:center;font-size:.9rem;color:#546e7a">
      Already have an account? <a href="{{ url_for('login') }}" style="color:#2e7d32;font-weight:600">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
