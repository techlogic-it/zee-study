{% extends "base.html" %}
{% block title %}Log In – ZEE STUDY{% endblock %}

{% block content %}
<div class="container-sm">
  <div class="card" style="margin-top:2rem">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="ZEE STUDY" style="width:180px;height:auto;margin-bottom:.5rem;">
      <p>Log in to continue your revision</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-green btn-block btn-lg">Log In</button>
    </form>

    <div class="divider"></div>
    <p style="text-align:center;font-size:.9rem;color:#546e7a">
      New here? <a href="{{ url_for('register') }}" style="color:#2e7d32;font-weight:600">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
