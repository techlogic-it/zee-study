<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ZEE STUDY{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% if session.username %}
<nav>
  <a class="brand" href="{{ url_for('dashboard') }}">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="ZEE STUDY" style="height:38px;width:auto;vertical-align:middle;">
  </a>
  <div class="nav-links">
    <a href="{{ url_for('topics') }}">Start Quiz</a>
    <a href="{{ url_for('profile') }}">Profile</a>
    <a href="{{ url_for('logout') }}">Log out</a>
  </div>
</nav>
{% endif %}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container" style="padding-bottom:0">
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

</body>
</html>
